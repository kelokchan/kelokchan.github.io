    <style>
      :root {
        --bg: #1a1b26;
        --fg: #a9b1d6;
        --fg-dim: #565f89;
        --accent: #f7768e;
        --green: #9ece6a;
        --blue: #7aa2f7;
        --yellow: #e0af68;
        --cyan: #7dcfff;
        --purple: #bb9af7;
        --titlebar: #13141d;
        --border: #292e42;
        --dot-red: #ff5f57;
        --dot-yellow: #febc2e;
        --dot-green: #28c840;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      ::selection {
        background: var(--blue);
        color: var(--bg);
      }

      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      body {
        background: #0a0b10;
        font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(16px, 4vw, 48px);
        -webkit-tap-highlight-color: transparent;
      }

      .terminal {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        width: 100%;
        max-width: 720px;
        max-height: min(85vh, 600px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .titlebar {
        background: var(--titlebar);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        user-select: none;
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .dot.red { background: var(--dot-red); }
      .dot.yellow { background: var(--dot-yellow); }
      .dot.green { background: var(--dot-green); }

      .titlebar-text {
        flex: 1;
        text-align: center;
        font-size: 12px;
        color: var(--fg-dim);
        margin-right: 52px;
      }

      .body {
        padding: clamp(20px, 3vw, 32px);
        flex: 1;
        overflow: auto;
        scroll-behavior: smooth;
      }

      .line {
        margin-bottom: 4px;
        line-height: 1.7;
        font-size: clamp(13px, 1.6vw, 15px);
        color: var(--fg);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .line.blank {
        height: 1.7em;
      }

      .prompt {
        color: var(--green);
      }

      .command {
        color: var(--fg);
        font-weight: 500;
      }

      .comment {
        color: var(--fg-dim);
      }

      .highlight {
        color: var(--yellow);
      }

      .key {
        color: var(--purple);
      }

      .value {
        color: var(--cyan);
      }

      .link {
        color: var(--blue);
        text-decoration: none;
        position: relative;
      }

      .link::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100%;
        height: 1px;
        background: var(--blue);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.3s cubic-bezier(0.77, 0, 0.175, 1);
      }

      @media (hover: hover) {
        .link:hover::after {
          transform: scaleX(1);
          transform-origin: left;
        }
      }

      .link:active {
        opacity: 0.7;
      }

      .accent {
        color: var(--accent);
        font-weight: 700;
      }

      .blue {
        color: var(--blue);
      }

      .cursor {
        display: inline-block;
        width: 8px;
        height: 1.1em;
        background: var(--fg);
        vertical-align: text-bottom;
        margin-left: 2px;
        animation: blink 1s step-end infinite;
      }

      .neofetch {
        display: flex;
        gap: clamp(16px, 3vw, 32px);
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .ascii-art {
        color: var(--accent);
        font-size: clamp(10px, 1.4vw, 14px);
        line-height: 1.2;
        white-space: pre;
        flex-shrink: 0;
      }

      .neofetch-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .neofetch-info .line {
        margin-bottom: 0;
      }

      .neofetch .ascii-art {
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1),
          transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      }

      .neofetch.visible .ascii-art {
        opacity: 1;
        transform: translateY(0);
      }

      .neo-line {
        display: none;
      }

      .neo-line.visible {
        display: block;
      }

      .separator {
        color: var(--fg-dim);
      }

      /* Hidden until typed */
      .line[data-line] {
        display: none;
      }

      .line[data-line].visible {
        display: block;
      }

      .neofetch[data-line] {
        display: none;
      }

      .neofetch[data-line].visible {
        display: flex;
      }

      .input-line {
        display: flex;
        align-items: center;
        line-height: 1.7;
        font-size: clamp(13px, 1.6vw, 15px);
        margin-bottom: 4px;
      }

      #term-input {
        background: none;
        border: none;
        color: var(--fg);
        font-family: inherit;
        font-size: inherit;
        font-weight: 500;
        outline: none;
        width: 100%;
        caret-shape: block;
        caret-color: var(--fg);
        line-height: inherit;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        [data-line] {
          display: block !important;
        }

        .neofetch[data-line] {
          display: flex !important;
        }

        .neofetch .ascii-art {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }

        .neo-line {
          display: block !important;
        }

        .cursor {
          animation: none;
        }
      }

      @media (max-width: 480px) {
        .terminal {
          border-radius: 8px;
        }

        .titlebar {
          padding: 10px 14px;
        }

        .dot {
          width: 10px;
          height: 10px;
        }

        .ascii-art {
          font-size: 9px;
        }
      }
    </style>
  </head>

    <script>
      console.log(

      (function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        var allLines = document.querySelectorAll('[data-line]');
        var cursor = document.querySelector('.cursor');

        function showLine(n) {
          allLines[n].classList.add('visible');
          scrollDown();
        }

        function typeSpans(lineIndex, speed) {
          return new Promise(function (resolve) {
            showLine(lineIndex);
            var spans = allLines[lineIndex].querySelectorAll('[data-type]');
            if (!spans.length) { resolve(); return; }

            var spanIdx = 0;
            var charIdx = 0;

            cursor.parentNode.removeChild(cursor);
            var lastSpan = spans[spans.length - 1];
            lastSpan.parentNode.insertBefore(cursor, lastSpan.nextSibling);

            function tick() {
              if (spanIdx >= spans.length) { resolve(); return; }
              var span = spans[spanIdx];
              var text = span.dataset.text;
              if (charIdx < text.length) {
                span.textContent += text[charIdx];
                charIdx++;
                scrollDown();
                setTimeout(tick, speed);
              } else {
                spanIdx++;
                charIdx = 0;
                tick();
              }
            }
            tick();
          });
        }

        var termBody = document.getElementById('terminal-body');

        function scrollDown() {
          termBody.scrollTop = termBody.scrollHeight;
        }

        function wait(ms) {
          return new Promise(function (r) { setTimeout(r, ms); });
        }

        function typeNeoLine(line, speed) {
          return new Promise(function (resolve) {
            line.classList.add('visible');
            var spans = line.querySelectorAll('[data-neo]');
            if (!spans.length) { scrollDown(); resolve(); return; }
            var spanIdx = 0;
            var charIdx = 0;
            function tick() {
              if (spanIdx >= spans.length) { resolve(); return; }
              var span = spans[spanIdx];
              var text = span.dataset.text;
              if (charIdx < text.length) {
                span.textContent += text[charIdx];
                charIdx++;
                scrollDown();
                setTimeout(tick, speed);
              } else {
                spanIdx++;
                charIdx = 0;
                tick();
              }
            }
            tick();
          });
        }

        async function revealNeofetch() {
          var neofetch = allLines[2];
          var neoLines = neofetch.querySelectorAll('.neo-line');
          for (var i = 0; i < neoLines.length; i++) {
            await typeNeoLine(neoLines[i], 8);
          }
        }

        async function run() {
          // neofetch
          await wait(150);
          await typeSpans(0, 25);
          await wait(200);

          showLine(1);
          showLine(2);
          await wait(100);
          await revealNeofetch();
          await wait(250);

          // cat contact.json
          showLine(3);
          await typeSpans(4, 25);
          await wait(150);

          showLine(5);
          await typeSpans(6, 12);
          await typeSpans(7, 8);
          await typeSpans(8, 8);
          await typeSpans(9, 8);
          await typeSpans(10, 8);
          await typeSpans(11, 12);
          await wait(150);

          // final prompt — hide static prompt, show interactive input
          showLine(12);
          allLines[13].style.display = 'none';
          cursor.style.display = 'none';
          enableInteractive();
        }

        run();

        function enableInteractive() {
          var inputLine = document.getElementById('input-line');
          var input = document.getElementById('term-input');
          inputLine.style.display = 'flex';
          input.focus();
          scrollDown();

          // Focus input when clicking anywhere in terminal body
          termBody.addEventListener('click', function () { input.focus(); });

          var history = [];
          var histIdx = -1;

          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              var cmd = input.value.trim();
              input.value = '';
              histIdx = -1;
              if (cmd) history.unshift(cmd);
              execCommand(cmd);
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              if (histIdx < history.length - 1) {
                histIdx++;
                input.value = history[histIdx];
              }
            } else if (e.key === 'ArrowDown') {
              e.preventDefault();
              if (histIdx > 0) {
                histIdx--;
                input.value = history[histIdx];
              } else {
                histIdx = -1;
                input.value = '';
              }
            } else if (e.key === 'l' && e.ctrlKey) {
              e.preventDefault();
              clearTerminal();
            }
          });

          function addLine(html) {
            var div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = html;
            termBody.insertBefore(div, inputLine);
            scrollDown();
          }

          function addBlank() {
            var div = document.createElement('div');
            div.className = 'line blank';
            termBody.insertBefore(div, inputLine);
          }

          function clearTerminal() {
            var children = Array.from(termBody.children);
            children.forEach(function (c) {
              if (c !== inputLine) termBody.removeChild(c);
            });
            scrollDown();
          }

              addBlank();

            neofetch: function () {

                '<div class="neofetch-info">' +
                '<div class="line" style="opacity:1;transform:none;"><span class="accent">kelok</span><span class="fg-dim">@</span><span class="accent">dev</span></div>' +
                '<div class="line" style="opacity:1;transform:none;"><span class="separator">-----------</span></div>' +
                '<div class="line" style="opacity:1;transform:none;"><span class="key">Name</span><span class="comment">     </span><span class="accent">Kelok Chan</span></div>' +
                '<div class="line" style="opacity:1;transform:none;"><span class="key">Role</span><span class="comment">     </span><span>Software Developer @ Kaikai Kiki</span></div>' +
                '<div class="line" style="opacity:1;transform:none;"><span class="key">Stack</span><span class="comment">    </span><span>TypeScript, JavaScript, C#</span></div>' +

              addLine('<span class="blue">contact.json</span>  <span class="blue">README.md</span>  <span class="blue">skills.txt</span>');
            },
            clear: function () {
              clearTerminal();
            },
            history: function () {
              addBlank();
              if (!history.length) {
                addLine('<span class="comment">No history yet.</span>');
                return;
              }
              for (var i = history.length - 1; i >= 0; i--) {
                addLine('  <span class="fg-dim">' + (history.length - i) + '</span>  ' + escapeHtml(history[i]));
              }
            },
            date: function () {
              addBlank();
              addLine('<span class="fg">' + new Date().toString() + '</span>');
            },
            joke: function () {
              addBlank();
              addLine('<span class="fg-dim">Loading...</span>');
              var loadingLine = inputLine.previousElementSibling;
              fetch('https://official-joke-api.appspot.com/random_joke')
                .then(function (r) { return r.json(); })
                .then(function (joke) {
                  loadingLine.innerHTML = '<span class="highlight">' + escapeHtml(joke.setup) + '</span>';
                  addLine('<span class="fg">' + escapeHtml(joke.punchline) + '</span>');
                })
                .catch(function () {
                  loadingLine.innerHTML = '<span class="comment">Couldn\'t fetch a joke. Try again.</span>';
                });
            },
            'cat README.md': function () {
              addBlank();
              addLine('<span class="accent"># Kelok Chan</span>');
              addBlank();
              addLine('<span class="fg">Software developer who likes building things for the web.</span>');
              addLine('<span class="fg">Currently at Kaikai Kiki.</span>');
              addBlank();
              addLine('<span class="comment">Type `help` to see available commands.</span>');
            },
            'cat skills.txt': function () {
              addBlank();
              addLine('<span class="highlight">Languages</span>');
              addLine('<span class="fg">  TypeScript, JavaScript, C#, Dart</span>');
              addBlank();
              addLine('<span class="highlight">Frameworks</span>');
              addLine('<span class="fg">  React, Node.js, Flutter, .NET</span>');
              addBlank();
              addLine('<span class="highlight">Other</span>');
              addLine('<span class="fg">  Web3, Solidity, GraphQL, Git</span>');
            }
          };

          // Easter eggs
          var eggs = {
            'sudo': function () { addBlank(); addLine('<span class="accent">Nice try.</span>'); },
            'rm -rf /': function () { addBlank(); addLine('<span class="accent">Yeah, no.</span>'); },
            'rm -rf': function () { addBlank(); addLine('<span class="accent">I like living, thanks.</span>'); },
            'exit': function () { addBlank(); addLine('<span class="comment">There is no escape.</span>'); },
            'cd ..': function () { addBlank(); addLine('<span class="comment">You\'re already home.</span>'); },
            'pwd': function () { addBlank(); addLine('<span class="fg">/home/kelok</span>'); },
            'vim': function () { addBlank(); addLine('<span class="comment">Good luck getting out.</span>'); },
            'emacs': function () { addBlank(); addLine('<span class="comment">Let\'s not start a war.</span>'); },
            'curl': function () { addBlank(); addLine('<span class="comment">curl: try adding a URL next time</span>'); },
            'ping': function () { addBlank(); addLine('<span class="fg">pong</span>'); },
            'hello': function () { addBlank(); addLine('<span class="green prompt">Hey there!</span> <span class="fg">Type</span> <span class="command">help</span> <span class="fg">to explore.</span>'); },
            'hi': function () { commands['hello'](); },
          };

          function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          }

          function execCommand(cmd) {
            addLine('<span class="prompt">&#10095; </span><span class="command">' + escapeHtml(cmd) + '</span>');

            if (!cmd) return;

            var lower = cmd.toLowerCase();
            if (commands[lower]) {
              commands[lower]();
            } else if (eggs[lower]) {
              eggs[lower]();
            } else if (lower.startsWith('echo ')) {
              addBlank();
              addLine('<span class="fg">' + escapeHtml(cmd.slice(5)) + '</span>');
            } else if (lower.startsWith('sudo ')) {
              addBlank();
              addLine('<span class="accent">Permission denied. Nice try though.</span>');
            } else if (lower.startsWith('cat ')) {
              addBlank();
              addLine('<span class="accent">cat: ' + escapeHtml(cmd.slice(4)) + ': No such file</span>');
            } else if (lower.startsWith('open ') || lower.startsWith('xdg-open ')) {
              addBlank();
              addLine('<span class="comment">Try clicking the links in contact.json instead.</span>');
            } else {
              addBlank();
              addLine('<span class="accent">command not found: ' + escapeHtml(cmd) + '</span>');
              addLine('<span class="comment">Here\'s a joke instead:</span>');
              addBlank();
              addLine('<span class="fg-dim">Loading...</span>');
              var loadingLine = inputLine.previousElementSibling;
              fetch('https://official-joke-api.appspot.com/random_joke')
                .then(function (r) { return r.json(); })
                .then(function (joke) {
                  loadingLine.innerHTML = '<span class="highlight">' + escapeHtml(joke.setup) + '</span>';
                  addLine('<span class="fg">' + escapeHtml(joke.punchline) + '</span>');
                })
                .catch(function () {
                  loadingLine.innerHTML = '<span class="comment">Couldn\'t fetch a joke. Try again.</span>';
                });
            }

            addBlank();
            scrollDown();
            input.focus();
          }
        }
      })();
    </script>
  </body>
</html>
